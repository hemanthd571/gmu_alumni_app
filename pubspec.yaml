


name: gmu_alumni_app
description: GMU Alumni Connect Mobile Application
publish_to: 'none'
version: 1.0.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.0
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Navigation
  go_router: ^12.1.3
  
  # Maps & Location
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Image Handling
  image_picker: ^1.0.5
  
  # File Handling
  path_provider: ^2.1.1
  open_file: ^3.3.2
  # file_picker: ^6.1.1  # Temporarily removed due to v1 embedding issues
  
  # URL Launcher
  url_launcher: ^6.2.2
  
  # Date & Time
  intl: ^0.18.1
  
  # Notifications
  flutter_local_notifications:
  
  # Calendar
  add_2_calendar: ^3.0.1
  table_calendar: ^3.0.9
  
  # Share
  share_plus: ^7.2.1
  
  # Connectivity
  connectivity_plus: ^5.0.2
  scrollable_positioned_list: ^0.3.8
  flutter_staggered_animations: ^1.1.1
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  video_player: ^2.14.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  printing: ^5.15.0
  pdf: ^3.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/proud/
    - assets/images/gallery/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/gems_gm_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#5B1F1F"
  adaptive_icon_foreground: "assets/images/gems_gm_logo.png"
